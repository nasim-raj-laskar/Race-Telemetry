artifacts_root: artifacts

data_ingestion:
  root_dir: artifacts/data_ingestion
  DATABASE_NAME: "Nasimrl"
  COLLECTION_NAME: "Race_data"
  local_data_file: artifacts/data_ingestion/raw.csv 

data_validation:
  root_dir: artifacts/data_validation
  local_data_file: artifacts/data_ingestion/raw.csv
  STATUS_FILE: artifacts/data_validation/status.txt

data_transformation:
  raw_data_path: artifacts/data_ingestion/raw.csv
  processed_dir: artifacts/data_transformation
  processed_file_path: artifacts/data_transformation/telemetry_features.csv
  train_path: artifacts/data_transformation/train.csv
  val_path: artifacts/data_transformation/val.csv
  test_path: artifacts/data_transformation/test.csv


model_trainer:
  model_root_dir: artifacts/model_trainer
  train_path: artifacts/data_transformation/train.csv
  val_path: artifacts/data_transformation/val.csv
  regression_dir: artifacts/model_trainer/regression
  classification_dir: artifacts/model_trainer/classification
  clustering_dir: artifacts/model_trainer/clustering

model_evaluation:
  root_dir: artifacts/model_evaluation
  val_path: artifacts/data_transformation/val.csv
  models:
    lap_time_regressor: artifacts/model_trainer/regression/model.pkl
    gear_classifier: artifacts/model_trainer/classification/model.pkl
    driving_behavior: artifacts/model_trainer/clustering/model.pkl
  scalers:
    driving_behavior: artifacts/model_trainer/clustering/scaler.pkl
  metrics_path: artifacts/model_evaluation/metrics.json

