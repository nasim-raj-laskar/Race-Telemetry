version: "3.9"

services:
  backend:
    image: ${ECR_IMAGE}
    container_name: telemetry-backend
    command: >
      uvicorn backend.main:app
      --host 0.0.0.0
      --port 8000
    ports:
      - "8000:8000"
    env_file:
      - .env

  frontend:
    image: ${ECR_IMAGE}
    container_name: telemetry-frontend
    command: >
      streamlit run app.py
      --server.port 8501
      --server.address 0.0.0.0
    ports:
      - "8501:8501"
    depends_on:
      - backend

  prometheus:
    image: prom/prometheus
    ports:
      - "9090:9090"

  grafana:
    image: grafana/grafana
    ports:
      - "3000:3000"